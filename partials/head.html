<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b2b47" />
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
  <script>
    // Шторка и свой курсор включаются только вместе с JS; если скрипт не загрузился за 4 с — страница просто открывается
    // Шторка закрывает страницу при загрузке только после перехода внутри сайта — прямой заход видит контент сразу
    var h = document.documentElement;
    h.classList.add('js');
    try { if (sessionStorage.getItem('omt-curtain')) { h.classList.add('curtain-in'); sessionStorage.removeItem('omt-curtain'); } } catch (e) {}
    setTimeout(function () { if (!window.__omtReady) h.classList.remove('js', 'curtain-in'); }, 4000);
  </script>
