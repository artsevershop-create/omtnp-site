<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b2b47" />
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
  <script>
    // Шторка и свой курсор включаются только вместе с JS; если скрипт не загрузился за 4 с — страница просто открывается
    document.documentElement.classList.add('js');
    setTimeout(function () { if (!window.__omtReady) document.documentElement.classList.remove('js'); }, 4000);
  </script>
